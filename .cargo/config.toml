[build]

[target.x86_64-unknown-none]
rustflags = [
    "--cfg",
    'target_min_page="4kib"',
    "-C",
    "force-frame-pointers",
    "--cfg",
    "aes_force_soft",
    "--cfg",
    'aes_backend="soft"',
    "--cfg",
    "polyval_force_soft",
]

[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "code-model=kernel", "--cfg", 'target_min_page="4kib"']

[alias]
verify = "verus focus --features verus"
xbuild = "run --package xbuild --release --"
